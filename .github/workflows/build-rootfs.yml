name: Build Rootfs Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Rootfs version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
  release:
    types: [created]

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
      
      - name: Build rootfs artifact
        run: |
          bash scripts/build-rootfs-artifact.sh ./rootfs-artifacts
      
      - name: Get artifact filename
        id: artifact
        run: |
          ARTIFACT_FILE=$(ls rootfs-artifacts/*.ext4.zst)
          echo "file=$ARTIFACT_FILE" >> $GITHUB_OUTPUT
          echo "filename=$(basename $ARTIFACT_FILE)" >> $GITHUB_OUTPUT
      
      - name: Upload artifact to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            ${{ steps.artifact.outputs.file }} \
            ${{ steps.artifact.outputs.file }}.sha256
      
      - name: Upload artifact to workflow
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-artifact
          path: |
            rootfs-artifacts/*.ext4.zst
            rootfs-artifacts/*.sha256
          retention-days: 30
      
      - name: Comment artifact info
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "## Rootfs Artifact Built Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ steps.artifact.outputs.filename }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $(du -h ${{ steps.artifact.outputs.file }} | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ${{ steps.artifact.outputs.file }}.sha256 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To use this artifact:" >> $GITHUB_STEP_SUMMARY
          echo "1. Download from the artifacts section above" >> $GITHUB_STEP_SUMMARY
          echo "2. Upload to GitHub Releases or your CDN" >> $GITHUB_STEP_SUMMARY
          echo "3. Update Dockerfile or docker-compose.yml with the URL" >> $GITHUB_STEP_SUMMARY
